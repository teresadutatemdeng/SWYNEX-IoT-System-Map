<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">SWYNEX IoT Room Temperature Monitoring</text>
<text x="600" y="90" text-anchor="middle" font-family="Arial" font-size="16">Software simulation — no physical hardware required</text>

<g font-family="Arial" font-size="18" text-anchor="middle">
<rect x="55" y="180" width="190" height="100" rx="15" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<text x="150" y="220">Simulated</text><text x="150" y="248">Temperature Sensor</text>

<rect x="300" y="180" width="190" height="100" rx="15" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<text x="395" y="220">IoT Device /</text><text x="395" y="248">Simulator</text>

<rect x="545" y="180" width="190" height="100" rx="15" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<text x="640" y="220">MQTT Broker /</text><text x="640" y="248">Cloud API</text>

<rect x="790" y="180" width="190" height="100" rx="15" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<text x="885" y="220">Cloud</text><text x="885" y="248">Database</text>

<rect x="900" y="400" width="230" height="100" rx="15" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<text x="1015" y="440">Web Dashboard</text><text x="1015" y="468">Current + History</text>

<rect x="580" y="400" width="230" height="100" rx="15" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<text x="695" y="440">Alert Rule</text><text x="695" y="468">&gt; 30°C → Notify</text>
</g>

<g stroke="#222" stroke-width="3" fill="none">
<path d="M245 230 L300 230"/><path d="M490 230 L545 230"/><path d="M735 230 L790 230"/>
<path d="M885 280 L885 350 L1015 350 L1015 400"/>
<path d="M885 280 L885 350 L695 350 L695 400"/>
</g>

<g font-family="Arial" font-size="15" fill="#333">
<text x="268" y="215">sensor data</text>
<text x="505" y="215">MQTT</text>
<text x="752" y="215">cloud data</text>
<text x="910" y="340">stored readings</text>
</g>

<text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Data flow: Sensor → Device → Connectivity → Cloud → Database → Dashboard / Alert</text>
</svg>